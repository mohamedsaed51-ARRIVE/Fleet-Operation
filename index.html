<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة تحكم قسم المتابعة — ARRIVE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#f4f8fd; --surface:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#0837c9; --teal:#00c7e6; --navy:#0f172a; --navy2:#0a1e6b;
  --good:#16a34a; --warn:#d97706; --bad:#dc2626;
  --side-w:248px;
  --font:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#131c2e; --ink:#e6edf6; --muted:#93a3b8; --line:#243047; --brand:#3b6bff; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);display:flex}
/* ---------- الشريط الجانبي ---------- */
.side{width:var(--side-w);flex:none;display:flex;flex-direction:column;gap:6px;padding:18px 12px;
  background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;overflow-y:auto}
.brand{padding:4px 10px 16px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.14)}
.brand b{font-size:22px;letter-spacing:.5px;font-weight:800}
.brand b::after{content:"";display:inline-block;width:8px;height:8px;margin-inline-start:5px;border-radius:50%;background:var(--teal)}
.brand small{display:block;margin-top:2px;color:rgba(255,255,255,.65);font-size:12px}
.nav-label{margin:12px 10px 2px;font-size:11px;color:rgba(255,255,255,.5);font-weight:600}
.tabs{display:flex;flex-direction:column;gap:4px}
.tab{display:flex;align-items:center;gap:10px;width:100%;text-align:start;font-family:inherit;font-size:14px;font-weight:700;
  cursor:pointer;color:rgba(255,255,255,.78);background:transparent;border:0;border-radius:10px;padding:11px 12px;
  border-inline-start:4px solid transparent}
.tab svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{background:rgba(255,255,255,.08);color:#fff}
.tab[aria-selected=true]{background:rgba(255,255,255,.14);color:#fff;border-inline-start-color:var(--teal)}
.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px}
.btn{font-family:inherit;font-size:12px;font-weight:600;color:#fff;background:transparent;text-align:center;
  border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none}
.btn:hover{background:rgba(255,255,255,.14)}
/* ---------- المحتوى ---------- */
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:var(--surface);border-bottom:1px solid var(--line);padding:12px 24px}
.topbar h1{margin:0;font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px}
.topbar h1::before{content:"";width:6px;height:24px;border-radius:3px;background:linear-gradient(var(--brand),var(--teal))}
.topbar .sub{color:var(--muted);font-size:12px}
main{flex:1;position:relative;min-height:0}
.panel{position:absolute;inset:0;display:none}
.panel.active{display:block}
iframe{width:100%;height:100%;border:0;background:var(--bg);display:block}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;pointer-events:none}
.panel.ready .loading{display:none}
/* ---------- المؤشرات الرئيسية ---------- */
#panel-overview{overflow:auto;padding:22px 24px 40px}
.ov-intro{color:var(--muted);font-size:13px;margin:0 0 18px}
.ov-sec{margin-bottom:28px}
.ov-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ov-head h2{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.ov-head h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--tone,var(--brand))}
.ov-head .state{font-size:11px;color:var(--muted)}
.ov-head a{margin-inline-start:auto;font-size:12px;font-weight:700;color:var(--brand);text-decoration:none;cursor:pointer}
.ov-head a:hover{text-decoration:underline}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.kc{--tone:var(--brand);position:relative;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--tone);
  border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(15,23,42,.06),0 4px 14px rgba(8,55,201,.05);min-width:0}
.kc.warn{--tone:var(--warn)} .kc.bad{--tone:var(--bad)} .kc.good{--tone:var(--good)}
.kc .l{font-size:12.5px;font-weight:700;color:var(--muted)}
.kc .v{font-size:30px;font-weight:800;line-height:1.2;margin:4px 0 2px;font-variant-numeric:tabular-nums;color:var(--ink)}
.kc.bad .v{color:var(--bad)} .kc.warn .v{color:var(--warn)}
.kc .s{font-size:11.5px;color:var(--muted);line-height:1.45}
.ov-empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;background:var(--surface)}
@media (max-width:820px){
  body{flex-direction:column}
  .side{width:100%;flex-direction:row;align-items:center;padding:8px 10px;gap:6px;overflow-x:auto}
  .brand{padding:0 8px;margin:0;border:0}.brand small,.nav-label,.side-foot{display:none}
  .tabs{flex-direction:row}.tab{white-space:nowrap;width:auto;padding:9px 12px;border-inline-start:0;border-bottom:3px solid transparent;border-radius:8px}
  .tab[aria-selected=true]{border-bottom-color:var(--teal)}
  .topbar{padding:10px 14px}.topbar h1{font-size:16px}
  #panel-overview{padding:16px 14px 32px}
}
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><b>ARRIVE</b><small>قسم المتابعة</small></div>
  <div class="nav-label">القائمة</div>
  <nav class="tabs" role="tablist" aria-label="لوحات قسم المتابعة" aria-orientation="vertical"></nav>
  <div class="side-foot">
    <button class="btn" id="reload" type="button">تحديث اللوحة</button>
    <a class="btn" id="newtab" href="#" target="_blank" rel="noopener">فتح في تبويب مستقل</a>
  </div>
</aside>
<div class="content">
  <header class="topbar">
    <h1 id="ttl">لوحة تحكم قسم المتابعة</h1>
    <div class="sub">ARRIVE — عدم الإبلاغ وعدم إرسال الصور • Fleet Validation • Fleet Support • العرض التقديمي</div>
  </header>
  <main id="main"></main>
</div>

<script>
var ICON = {
  home:'<path d="M3 11 12 3l9 8M5 10v10h14V10M10 20v-6h4v6"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v12H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
  support:'<path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H4zM17 14h3v5h-3zM20 19a4 4 0 0 1-4 3h-2"/>',
  slides:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8M7 12l3-3 3 2 4-4"/>'
};
// لوحات القسم. كل لوحة تعمل كما هي (بياناتها ورابط Apps Script الخاص بها) داخل تبويب.
// "المؤشرات الرئيسية" تجمع كروت المؤشرات الظاهرة حاليًا في كل لوحة (تُقرأ من اللوحات نفسها، بدون أرقام مكررة).
var DASHBOARDS = [
  { id: "overview",   title: "المؤشرات الرئيسية",             icon: "home",   overview: true },
  { id: "reporting",  title: "عدم الإبلاغ / عدم إرسال صورة", icon: "camera", src: "pages/non-reporting.html", tone: "#0837c9",
    sel: "#kpis .kpi", map: { l: ".l", v: ".v", s: ".n" } },
  { id: "validation", title: "Fleet Validation",              icon: "check",  src: "pages/validation.html",   tone: "#00a9c4",
    sel: ".kpis .kpi", map: { l: ".l", v: ".v", s: ".s" } },
  { id: "support",    title: "Control Tower",                  icon: "support",src: "pages/support.html",      tone: "#334155",
    sel: "#homeKpis .ar-kpi", map: { l: ".lbl", v: ".val", s: ".sub" } },
  // العرض التقديمي: يقرأ أرقامه من اللوحات الثلاث (نفس الصفحات المحمّلة هنا) ويعرضها بشكل التقرير التنفيذي
  { id: "deck",       title: "العرض التقديمي",                icon: "slides", src: "pages/presentation.html", tone: "#1e2761", deck: true }
];

var tabsEl = document.querySelector(".tabs"), main = document.getElementById("main");
var current = null, ttl = document.getElementById("ttl");

DASHBOARDS.forEach(function (d) {
  var b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.id = "tab-" + d.id;
  b.setAttribute("role", "tab"); b.setAttribute("aria-controls", "panel-" + d.id);
  b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[d.icon] + '</svg><span></span>';
  b.lastChild.textContent = d.title;
  b.addEventListener("click", function () { location.hash = d.id; });
  tabsEl.appendChild(b);

  var p = document.createElement("section");
  p.className = "panel"; p.id = "panel-" + d.id; p.setAttribute("role", "tabpanel");
  if (!d.overview) p.innerHTML = '<div class="loading">جارٍ تحميل اللوحة…</div>';
  main.appendChild(p);
  d.tab = b; d.panel = p;
});

/* ---------- تحميل اللوحات ---------- */
function loadFrame(d, visible) {
  if (d.frame) return d.frame;
  var f = document.createElement("iframe");
  f.title = d.title; f.src = d.src;
  f.addEventListener("load", function () { d.panel.classList.add("ready"); if (d.sel) watch(d); });
  d.panel.appendChild(f); d.frame = f;
  return f;
}

/* ---------- المؤشرات الرئيسية ---------- */
var ovEl = document.getElementById("panel-overview");
function txt(root, sel) { var n = sel && root.querySelector(sel); return n ? n.textContent.replace(/\s+/g, " ").trim() : ""; }

function harvest(d) {
  var doc;
  try { doc = d.frame.contentDocument; if (!doc || !doc.body) return null; } catch (e) { return "blocked"; }
  var out = [];
  doc.querySelectorAll(d.sel).forEach(function (n) {
    var cls = n.className || "", kind = /bad|violation/.test(cls) ? "bad" : /warn|under-action/.test(cls) ? "warn" : /success/.test(cls) ? "good" : "";
    var o = { l: txt(n, d.map.l), v: txt(n, d.map.v), s: txt(n, d.map.s), k: kind };
    if (o.l && o.v) out.push(o);
  });
  return out;
}

/* ---------- الملخص المجمّع: Control Tower + Validation مع فلتر الشهر ---------- */
var MN = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function normYM(x) {
  var t = String(x == null ? "" : x).trim(), m = t.match(/^(\d{4})[-\/](\d{1,2})/);
  if (m) return m[1] + "-" + ("0" + m[2]).slice(-2);
  if (t && /[A-Za-z]{3}/.test(t)) { var d = new Date(t); if (!isNaN(d)) return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2); }
  return "";
}
function ymLabel(ym) { return ym ? MN[+ym.slice(5) - 1] + " " + ym.slice(0, 4) : "كل الشهور"; }
function fnum(n) { return n == null || isNaN(n) ? "—" : Math.round(n).toLocaleString("en-US"); }
function fpct(a, b) { return b ? (Math.round(a / b * 1000) / 10).toFixed(1) + "%" : "—"; }
function bridgeOf(id) { try { var d = DASHBOARDS.filter(function (x) { return x.id === id; })[0]; var w = d && d.frame && d.frame.contentWindow; return w && w.__deck && w.__deck.ready() ? w.__deck : null; } catch (e) { return null; } }
var ovMonth = "", ovCache = {};
function ovMonths() {
  var set = {}, v = bridgeOf("validation"), s = bridgeOf("support");
  try { (v.data().months || []).forEach(function (m) { var k = normYM(m.m); if (k) set[k] = 1; }); } catch (e) {}
  try { (s.state().data.filterOptions.availableMonths || []).forEach(function (m) { var k = normYM(m); if (k) set[k] = 1; }); } catch (e) {}
  return Object.keys(set).sort();
}
function ctMonthData(ym) {
  var s = bridgeOf("support"); if (!s) return Promise.resolve(null);
  var key = "ct" + ym; if (ovCache[key]) return ovCache[key];
  var par = ym ? { dateFrom: ym + "-01", dateTo: ym + "-" + new Date(+ym.slice(0, 4), +ym.slice(5), 0).getDate() } : {};
  return ovCache[key] = s.call("analytics", par).then(function (a) {
    var m = ym && (a.monthly || []).filter(function (x) { return normYM(x.month) === ym; })[0];
    if (m) return m;
    var rows = a.employeeOutcome || [], g = function (k) { return rows.reduce(function (t, r) { return t + (r[k] || 0); }, 0); };
    return { total: (a.team && a.team.total) || g("total"), resolved: g("resolved"), unresolved: g("unresolved"), confirmed: g("confirmed"), notConfirmed: g("notConfirmed") };
  }).catch(function () { delete ovCache[key]; return null; });
}
function valMonthData(ym) {
  var v = bridgeOf("validation"); if (!v) return null;
  var D = v.data(), n = function (rows, f) { return rows.reduce(function (t, r) { return t + ((!f || f(r)) ? r.n : 0); }, 0); };
  var inM = function (r) { return !ym || r.m === ym; }, O = D.O.filter(inM), U = D.U.filter(inM);
  var del = O.filter(function (r) { return r.sec === "delivery"; }), can = O.filter(function (r) { return r.sec === "cancel"; });
  var res = n(O, function (r) { return r.fin === "responded"; }), nor = n(O, function (r) { return r.fin === "noresp"; });
  return { del: n(del), can: n(can), unc: n(U), res: res, nor: nor, ready: n(O, function (r) { return r.fin === "responded" && r.ready; }) };
}
function kcard(l, v, s, tone) { return '<div class="kc" style="--tone:' + tone + '"><div class="l">' + esc(l) + '</div><div class="v">' + esc(v) + '</div>' + (s ? '<div class="s">' + esc(s) + '</div>' : "") + '</div>'; }
var comboEl = null, comboTok = 0;
function renderCombo() {
  if (!comboEl) return;
  var months = ovMonths(), tok = ++comboTok;
  if (!bridgeOf("support") && !bridgeOf("validation")) { comboEl.innerHTML = '<div class="ov-empty">جارٍ تحميل بيانات Control Tower و Validation…</div>'; return; }
  if (ovMonth && months.indexOf(ovMonth) < 0) ovMonth = "";
  if (ovMonth === "" && !comboEl.getAttribute("data-init") && months.length) { ovMonth = months[months.length - 1]; comboEl.setAttribute("data-init", "1"); }
  var opts = '<option value="">كل الشهور</option>' + months.map(function (m) { return '<option value="' + m + '"' + (m === ovMonth ? " selected" : "") + '>' + ymLabel(m) + '</option>'; }).join("");
  ctMonthData(ovMonth).then(function (c) {
    if (tok !== comboTok) return;
    var v = valMonthData(ovMonth), ct = c ? c.total : null, vt = v ? v.del + v.can + v.unc : null;
    var tot = (ct == null && vt == null) ? null : (ct || 0) + (vt || 0), body = "";
    body += '<div class="kgrid">' +
      kcard("إجمالي حالات القسم (Control Tower + Validation)", fnum(tot), ct == null || vt == null ? "أحد المصدرين غير متاح حاليًا — الإجمالي جزئي" : "مجموع الفريقين", "#1e2761") +
      kcard("Control Tower", fnum(ct), (tot && ct != null) ? fpct(ct, tot) + " من إجمالي القسم" : "", "#334155") +
      kcard("Validation", fnum(vt), (tot && vt != null) ? fpct(vt, tot) + " من إجمالي القسم" : "", "#00a9c4") + '</div>';
    body += '<div class="ov-head" style="margin-top:18px"><h2 style="--tone:#334155">Control Tower</h2></div><div class="kgrid">' + (c ?
      kcard("إجمالي الحالات", fnum(c.total), "", "#334155") + kcard("تم الحل", fnum(c.resolved), fpct(c.resolved, c.total) + " من الإجمالي", "#16a34a") +
      kcard("تم التأكيد", fnum(c.confirmed), fpct(c.confirmed, c.total) + " من الإجمالي", "#16a34a") +
      kcard("الحل والتأكيد", fpct((c.resolved || 0) + (c.confirmed || 0), c.total), "(تم الحل + تم التأكيد) ÷ الإجمالي", "#0837c9") : '<div class="ov-empty">بيانات Control Tower غير متاحة حاليًا.</div>') + '</div>';
    body += '<div class="ov-head" style="margin-top:18px"><h2 style="--tone:#00a9c4">Validation</h2></div><div class="kgrid">' + (v ?
      kcard("إجمالي Validation", fnum(vt), "", "#00a9c4") + kcard("مشاكل التسليم", fnum(v.del), fpct(v.del, vt) + " من Validation", "#00a9c4") +
      kcard("الإلغاءات", fnum(v.can), fpct(v.can, vt) + " من Validation", "#00a9c4") + kcard("لم يتم التأكيد", fnum(v.unc), fpct(v.unc, vt) + " من Validation", "#00a9c4") +
      kcard("نسبة الرد (تسليم + إلغاء)", fpct(v.res, v.res + v.nor), "تم الرد " + fnum(v.res) + " من " + fnum(v.res + v.nor), "#0837c9") : '<div class="ov-empty">بيانات Validation غير متاحة حاليًا.</div>') + '</div>';
    comboEl.innerHTML = '<section class="ov-sec"><div class="ov-head"><h2 style="--tone:#1e2761">الملخص المجمّع للقسم — ' + ymLabel(ovMonth) + '</h2>' +
      '<label style="margin-inline-start:auto;font-size:12px;color:var(--muted)">الشهر: <select id="ovMonthSel" style="font-family:inherit;font-size:13px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)">' + opts + '</select></label></div>' + body + '</section>';
    document.getElementById("ovMonthSel").onchange = function () { ovMonth = this.value; comboEl.setAttribute("data-init", "1"); renderCombo(); };
  });
}
function renderOverview() {
  if (!comboEl || !ovEl.contains(comboEl)) { ovEl.innerHTML = '<div id="ovCombo"></div><div id="ovCards"></div>'; comboEl = document.getElementById("ovCombo"); renderCombo(); }
  var h = '<p class="ov-intro">تفاصيل المؤشرات من كل لوحة كما تظهر فيها حاليًا. للتفاصيل والفلاتر افتح اللوحة المعنية.</p>';
  DASHBOARDS.forEach(function (d) {
    if (d.overview || d.deck) return;
    var k = d.kpis, body;
    if (k === "blocked") body = '<div class="ov-empty">تعذّر قراءة المؤشرات من هذه اللوحة (افتح الصفحة عبر رابط الموقع وليس كملف محلي).</div>';
    else if (!k || !k.length) body = '<div class="ov-empty">' + (d.ready ? "لا توجد كروت مؤشرات ظاهرة في هذه اللوحة حاليًا." : "جارٍ تحميل البيانات…") + '</div>';
    else body = '<div class="kgrid">' + k.map(function (c) {
      return '<div class="kc ' + c.k + '" style="' + (c.k ? "" : "--tone:" + d.tone) + '"><div class="l">' + esc(c.l) + '</div><div class="v">' + esc(c.v) + '</div>' +
        (c.s ? '<div class="s">' + esc(c.s) + '</div>' : "") + '</div>';
    }).join("") + '</div>';
    h += '<section class="ov-sec" style="--tone:' + d.tone + '"><div class="ov-head"><h2>' + esc(d.title) + '</h2>' +
      '<a href="#' + d.id + '">فتح اللوحة ‹</a></div>' + body + '</section>';
  });
  document.getElementById("ovCards").innerHTML = h;
}
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

var rt = null;
function refreshOverview() { clearTimeout(rt); rt = setTimeout(function () {
  DASHBOARDS.forEach(function (d) { if (d.frame && d.sel) { d.kpis = harvest(d); d.ready = d.panel.classList.contains("ready"); } });
  renderOverview();
  var sig = (bridgeOf("support") ? 1 : 0) + "" + (bridgeOf("validation") ? 1 : 0);
  if (sig !== comboSig) { comboSig = sig; ovCache = {}; renderCombo(); }
}, 250); }
var comboSig = "";

function watch(d) {
  refreshOverview();
  try {
    new MutationObserver(refreshOverview).observe(d.frame.contentDocument.body, { subtree: true, childList: true, characterData: true });
  } catch (e) {}
}

/* ---------- التنقل ---------- */
function show(id) {
  var d = DASHBOARDS.filter(function (x) { return x.id === id; })[0] || DASHBOARDS[0];
  current = d;
  DASHBOARDS.forEach(function (x) {
    var on = x === d;
    x.tab.setAttribute("aria-selected", on);
    x.panel.classList.toggle("active", on);
  });
  ttl.textContent = d.title;
  if (d.overview) {
    DASHBOARDS.forEach(function (x) { if (!x.overview && !x.deck) loadFrame(x); });   // نحمّل اللوحات ليقرأ منها الملخص
    renderOverview(); refreshOverview();
  } else {
    if (d.deck) DASHBOARDS.forEach(function (x) { if (x.sel) loadFrame(x); });       // العرض يقرأ بياناته من اللوحات المحمّلة
    loadFrame(d);
  }
  var nt = document.getElementById("newtab");
  nt.style.display = d.overview ? "none" : ""; if (d.src) nt.href = d.src;
  try { sessionStorage.setItem("followup-tab", d.id); } catch (e) {}
}

function route() {
  var id = location.hash.replace("#", "");
  if (!id) { try { id = sessionStorage.getItem("followup-tab") || ""; } catch (e) {} }
  show(id);
}
window.addEventListener("hashchange", route);

document.getElementById("reload").addEventListener("click", function () {
  var ds = current && current.overview ? DASHBOARDS.filter(function (x) { return x.frame && !x.deck; }) : [current];
  ds.forEach(function (d) { if (d && d.frame) { d.panel.classList.remove("ready"); d.frame.src = d.src; } });
});

route();
</script>
</body>
</html>
