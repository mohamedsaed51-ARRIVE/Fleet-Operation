<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة تحكم قسم المتابعة — ARRIVE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#f4f8fd; --surface:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#0837c9; --brand-ink:#fff; --teal:#00c7e6;
  --font:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#131c2e; --ink:#e6edf6; --muted:#93a3b8; --line:#243047;
  --brand:#3b6bff; --brand-ink:#fff; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column}
.top{background:var(--surface);border-bottom:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px;text-wrap:balance}
h1::before{content:"";width:6px;height:24px;border-radius:3px;background:linear-gradient(var(--brand),var(--teal))}
.sub{color:var(--muted);font-size:12px;margin:2px 16px 0 0}
.actions{display:flex;gap:8px}
.btn{font-family:inherit;font-size:12px;font-weight:600;color:var(--brand);background:transparent;
  border:1px solid var(--brand);border-radius:6px;padding:6px 12px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--brand);color:var(--brand-ink)}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:thin}
.tab{font-family:inherit;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer;
  background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;padding:10px 16px}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
main{flex:1;position:relative;min-height:0}
.panel{position:absolute;inset:0;display:none}
.panel.active{display:block}
iframe{width:100%;height:100%;border:0;background:var(--bg);display:block}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:14px;pointer-events:none}
.panel.ready .loading{display:none}
@media (max-width:600px){h1{font-size:17px}.tab{padding:9px 12px;font-size:13px}}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div>
      <h1>لوحة تحكم قسم المتابعة</h1>
      <div class="sub">ARRIVE — عدم الإبلاغ وعدم إرسال الصور • Fleet Validation • Fleet Support</div>
    </div>
    <div class="actions">
      <button class="btn" id="reload" type="button">تحديث اللوحة</button>
      <a class="btn" id="newtab" href="#" target="_blank" rel="noopener">فتح في تبويب مستقل</a>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="لوحات قسم المتابعة"></nav>
</header>
<main id="main"></main>

<script>
// لوحات القسم. كل لوحة تعمل كما هي (بياناتها ورابط Apps Script الخاص بها) داخل تبويب،
// وتُحمَّل عند أول فتح فقط حتى لا تُستدعى 3 واجهات API معًا عند الدخول.
var DASHBOARDS = [
  { id: "reporting",  title: "عدم الإبلاغ / عدم إرسال صورة", src: "pages/non-reporting.html" },
  { id: "validation", title: "Fleet Validation",              src: "pages/validation.html" },
  { id: "support",    title: "Fleet Support",                 src: "pages/support.html" }
];

var tabsEl = document.querySelector(".tabs"), main = document.getElementById("main");
var current = null;

DASHBOARDS.forEach(function (d) {
  var b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.id = "tab-" + d.id; b.textContent = d.title;
  b.setAttribute("role", "tab"); b.setAttribute("aria-controls", "panel-" + d.id);
  b.addEventListener("click", function () { location.hash = d.id; });
  tabsEl.appendChild(b);

  var p = document.createElement("section");
  p.className = "panel"; p.id = "panel-" + d.id; p.setAttribute("role", "tabpanel");
  p.innerHTML = '<div class="loading">جارٍ تحميل اللوحة…</div>';
  main.appendChild(p);
  d.tab = b; d.panel = p;
});

function show(id) {
  var d = DASHBOARDS.filter(function (x) { return x.id === id; })[0] || DASHBOARDS[0];
  current = d;
  DASHBOARDS.forEach(function (x) {
    var on = x === d;
    x.tab.setAttribute("aria-selected", on);
    x.panel.classList.toggle("active", on);
  });
  if (!d.frame) {
    var f = document.createElement("iframe");
    f.title = d.title; f.src = d.src; f.loading = "lazy";
    f.addEventListener("load", function () { d.panel.classList.add("ready"); });
    d.panel.appendChild(f); d.frame = f;
  }
  document.getElementById("newtab").href = d.src;
  try { sessionStorage.setItem("followup-tab", d.id); } catch (e) {}
}

function route() {
  var id = location.hash.replace("#", "");
  if (!id) { try { id = sessionStorage.getItem("followup-tab") || ""; } catch (e) {} }
  show(id);
}
window.addEventListener("hashchange", route);

document.getElementById("reload").addEventListener("click", function () {
  if (!current || !current.frame) return;
  current.panel.classList.remove("ready");
  current.frame.src = current.src;
});

route();
</script>
</body>
</html>
