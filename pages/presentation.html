<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>العرض التقديمي — Fleet Support</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{
  --navy:#1E2761; --ink:#1B1F3B; --steel:#1F3A5F; --gold:#D4A94C; --red:#C8553D; --teal:#2A9D8F;
  --mid:#3A4690; --soft:#F4F5FA; --line:#D9DCEB; --muted:#6B7280; --white:#fff;
  --font:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:#2b2f45;color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
/* ---------- شريط التحكم (لا يُطبع) ---------- */
.chrome{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;background:#161a33;color:#fff;font-size:13px}
.chrome button,.chrome select{font-family:inherit;font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:6px 12px;cursor:pointer}
.chrome select option{color:#111}
.chrome button:hover{background:rgba(255,255,255,.2)}
.chrome button:disabled{opacity:.4;cursor:default}
.chrome .sp{flex:1}
.chrome .cnt{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.ms{position:relative}
.ms .pn{display:none;position:absolute;top:calc(100% + 4px);right:0;z-index:60;background:#fff;color:#111;min-width:240px;max-height:340px;overflow:auto;padding:6px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ms.open .pn{display:block}
.ms .pn label{display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:13px;cursor:pointer;border-radius:5px}
.ms .pn label:hover{background:#eef0fa}
.ms .pn .clr{display:block;width:100%;margin-bottom:4px;color:#111;background:#eef0fa;border:0}
.ms button.on{background:var(--gold);color:#1b1f3b;border-color:var(--gold)}
.chip{font-size:11.5px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.12)}
.chip.ok{background:rgba(42,157,143,.35)} .chip.bad{background:rgba(200,85,61,.45)}
.viewport{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;position:relative}
.scaler{direction:ltr;position:relative}
.stage{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:top left}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cbd0ea;font-size:16px;text-align:center;padding:30px;pointer-events:none;white-space:pre-line}
/* ---------- الشريحة 1280×720 ---------- */
.sl{display:none;position:absolute;inset:0;width:1280px;height:720px;background:#fff;overflow:hidden;direction:rtl;text-align:right;color:var(--ink)}
.sl.on{display:block}
.sl .tag{position:absolute;top:26px;right:48px;left:48px;font-size:15px;font-weight:700;color:var(--gold)}
.sl h2{position:absolute;top:50px;right:48px;left:48px;margin:0;font-size:33px;line-height:1.3;font-weight:800;color:var(--navy)}
.sl .sub{position:absolute;top:100px;right:48px;left:48px;font-size:16px;color:var(--muted)}
.sl .body{position:absolute;top:140px;right:48px;left:48px;bottom:56px}
.sl .ft{position:absolute;bottom:16px;right:48px;left:48px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.sl.dark{background:var(--navy);color:#fff}
.sl.steel{background:var(--steel);color:#fff}
.sl.dark h2,.sl.steel h2{color:#fff}
.sl.cover::before{content:"";position:absolute;width:700px;height:700px;left:-120px;top:10px;border:3px solid var(--gold);border-radius:50%;opacity:.8}
.sl.cover::after{content:"";position:absolute;width:560px;height:560px;left:-50px;top:80px;border:2px solid rgba(255,255,255,.55);border-radius:50%}
.cv{position:absolute;right:80px;top:210px;width:520px}
.cv h1{margin:0 0 10px;font-size:52px;line-height:1.25;font-weight:800}
.cv p{margin:6px 0;font-size:22px;opacity:.9}
.cv .by{margin-top:34px;font-size:16px;opacity:.8}
.cv .mo{position:absolute;right:0;top:420px;color:var(--gold);font-size:22px;font-weight:700}
.divider{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800}
/* ---------- مكونات ---------- */
.kb{border-radius:6px;padding:14px 18px;text-align:center;display:flex;flex-direction:column;justify-content:center;background:var(--soft);border:1px solid var(--line);min-width:0}
.kb .n{font-size:40px;font-weight:800;line-height:1.15;color:var(--navy);font-variant-numeric:tabular-nums}
.kb .l{font-size:15px;color:var(--ink);font-weight:600}
.kb .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.kb.navy{background:var(--navy);border-color:var(--navy)} .kb.navy .n{color:var(--gold)} .kb.navy .l,.kb.navy .s{color:#fff}
.kb.red{background:var(--red);border-color:var(--red)} .kb.teal{background:var(--teal);border-color:var(--teal)} .kb.gold{background:var(--gold);border-color:var(--gold)}
.kb.red .n,.kb.teal .n,.kb.gold .n,.kb.red .l,.kb.teal .l,.kb.gold .l{color:#fff} .kb.red .s,.kb.teal .s,.kb.gold .s{color:rgba(255,255,255,.9)}
.kb.sm .n{font-size:30px} .kb.sm .l{font-size:14px}
.row{display:flex;gap:16px} .col{display:flex;flex-direction:column;gap:14px}
.fill{flex:1;min-width:0} .box{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:14px 18px}
.box h4{margin:0 0 8px;font-size:16px;color:var(--navy)}
.box.pink{background:#FBECE8;border-color:#F0C6BC} .box.pink h4{color:var(--red)}
.note{font-size:13.5px;color:var(--muted);line-height:1.7}
.big{font-size:56px;font-weight:800;color:var(--navy)}
ul.bl{margin:0;padding:0 18px 0 0;font-size:15px;line-height:1.9}
/* أعمدة رأسية */
.vw{display:flex;flex-direction:column;height:100%}
.vw>.vb{flex:1;min-height:0}
.vb{display:flex;align-items:flex-end;justify-content:space-around;gap:10px;height:100%;border-bottom:2px solid var(--line);padding:0 6px}
.vg{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;min-width:0}
.vcols{display:flex;align-items:flex-end;justify-content:center;gap:5px;width:100%;flex:1;padding-top:44px}
.vc{position:relative;flex:1;max-width:60px;min-height:2px;border-radius:2px 2px 0 0}
.vc b{position:absolute;bottom:100%;margin-bottom:3px;left:50%;transform:translateX(-50%);font-size:13px;line-height:1.25;text-align:center;color:var(--ink);white-space:nowrap}
.vl{margin-top:8px;font-size:13.5px;font-weight:600;text-align:center;line-height:1.35;min-height:38px}
.lg{display:flex;gap:18px;justify-content:center;font-size:13px;margin-top:8px}
.lg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-inline-end:6px;vertical-align:-1px}
/* أعمدة أفقية */
.hr{display:flex;align-items:center;gap:12px;margin:0 0 9px}
.hl{width:230px;flex:none;font-size:14.5px;font-weight:600;text-align:right;line-height:1.3}
.ht{flex:1;height:24px;background:var(--soft);border-radius:2px;overflow:hidden}
.ht i{display:block;height:100%;border-radius:2px}
.hv{width:130px;flex:none;font-size:14px;font-weight:700;text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
.st{flex:1;height:24px;display:flex;border-radius:2px;overflow:hidden;direction:ltr}
.st i{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-style:normal;color:#fff;font-weight:700;overflow:hidden;white-space:nowrap}
/* جداول */
table.tb{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
table.tb th{background:var(--navy);color:#fff;padding:7px 8px;font-weight:700;border:1px solid var(--navy);text-align:center}
table.tb th.g1{background:var(--teal);border-color:var(--teal)} table.tb th.g2{background:var(--gold);border-color:var(--gold)} table.tb th.g3{background:var(--red);border-color:var(--red)}
table.tb td{padding:5px 8px;border:1px solid var(--line);text-align:center}
table.tb td:first-child{text-align:right;font-weight:600}
table.tb tbody tr:nth-child(even){background:var(--soft)}
table.tb tr.tot td{background:var(--line);font-weight:800}
table.tb.sm{font-size:12.5px} table.tb.sm td{padding:3px 6px} table.tb.sm th{padding:5px 6px}
.red{color:var(--red);font-weight:700}
/* ---------- حالة عدم توفر بيانات ---------- */
.na{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:20px;text-align:center;border:2px dashed var(--line);border-radius:8px;padding:30px}
/* ---------- طباعة / PDF ---------- */
@media print{
  @page{size:1280px 720px;margin:0}
  html,body{height:auto;overflow:visible;background:#fff;display:block}
  .chrome,.msg{display:none!important}
  .viewport{display:block;padding:0;height:auto}
  .scaler{width:1280px!important;height:auto!important}
  .stage{position:static;transform:none!important;height:auto}
  .sl{display:block!important;position:relative;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:700px){.chrome .hide-s{display:none}}
</style>
</head>
<body>
<div class="chrome">
  <button id="prev" type="button" title="السابق">‹ السابق</button>
  <span class="cnt" id="cnt">—</span>
  <button id="next" type="button" title="التالي">التالي ›</button>
  <select id="jump" aria-label="انتقال إلى شريحة"></select>
  <select id="monthFrom" aria-label="من شهر" title="لتجميع أكثر من شهر اختر شهر البداية هنا وشهر النهاية في القائمة التالية"></select>
  <select id="month" aria-label="الشهر"></select>
  <div class="ms" id="fBr"><button type="button">الفرع: الكل ▾</button><div class="pn"></div></div>
  <div class="ms" id="fEmp"><button type="button">الموظف: الكل ▾</button><div class="pn"></div></div>
  <span class="sp"></span>
  <span id="st" class="hide-s"></span>
  <button id="reload" type="button">تحديث البيانات</button>
  <button id="full" type="button">ملء الشاشة</button>
  <button id="pptx" type="button" title="تنزيل العرض كملف PowerPoint (.pptx)">تنزيل PowerPoint</button>
  <button id="print" type="button">طباعة / PDF</button>
</div>
<div class="viewport" id="vp">
  <div class="scaler" id="scaler"><div class="stage" id="stage"></div></div>
  <div class="msg" id="msg">جارٍ قراءة بيانات اللوحات…</div>
</div>

<script>
/* =====================================================================
   العرض التقديمي — تقرير أداء Fleet Support
   لا يحتوي أرقامًا ثابتة: كل رقم يُحسب من بيانات اللوحات الثلاث
   (Fleet Validation / Fleet Support / عدم الإبلاغ وعدم إرسال الصورة).
   ===================================================================== */
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var f=function(n){return n==null||isNaN(n)?"—":Math.round(n).toLocaleString("en-US")};
var f1=function(n){return n==null||isNaN(n)?"—":(Math.round(n*10)/10).toLocaleString("en-US")};
var bd=function(t){return'<bdi dir="ltr">'+t+"</bdi>"};
var pc=function(a,b){return b?bd(Math.round(a/b*100)+"%"):"—"};
var pc1=function(a,b){return b?bd((Math.round(a/b*1000)/10).toFixed(1)+"%"):"—"};
var rate=function(a,b){return b?a/b*100:null};
var sum=function(a,fn){return a.reduce(function(s,x){return s+(fn?fn(x):x)},0)};
var MN=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function normYM(x){
  if(x instanceof Date&&!isNaN(x))return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2);
  var t=String(x==null?"":x).trim(),m=t.match(/^(\d{4})[-\/](\d{1,2})/);
  if(m)return m[1]+"-"+("0"+m[2]).slice(-2);
  if(t&&/[A-Za-z]{3}/.test(t)){var d=new Date(t);if(!isNaN(d))return normYM(d)}
  return "";
}
var ymLabel=function(ym){return ym?MN[+ym.slice(5)-1]+" "+ym.slice(0,4):""};
var ymName=function(ym){return ym?MN[+ym.slice(5)-1]:""};
var lastDay=function(ym){return new Date(+ym.slice(0,4),+ym.slice(5),0).getDate()};

/* ---------- الوصول إلى اللوحات ---------- */
var SRC={S:{id:"support",file:"support.html"},V:{id:"validation",file:"validation.html"},R:{id:"reporting",file:"non-reporting.html"}};
function frameWin(k){
  var s=SRC[k];
  try{var ds=parent!==window&&parent.DASHBOARDS;if(ds){var d=ds.filter(function(x){return x.id===s.id})[0];if(d&&d.frame&&d.frame.contentWindow)return d.frame.contentWindow}}catch(e){}
  if(!s.own){var i=document.createElement("iframe");i.style.cssText="position:absolute;width:1px;height:1px;border:0;visibility:hidden";i.src=s.file;document.body.appendChild(i);s.own=i}
  return s.own.contentWindow;
}
function bridge(k){try{var w=frameWin(k);return w&&w.__deck&&w.__deck.ready()?w.__deck:null}catch(e){return null}}
function waitReady(ms){
  return new Promise(function(res){
    var t0=Date.now();
    (function tick(){
      var ok={S:!!bridge("S"),V:!!bridge("V"),R:!!bridge("R")};
      var n=(ok.S?1:0)+(ok.V?1:0)+(ok.R?1:0),dt=Date.now()-t0;
      if(n===3||dt>ms||(n>0&&dt>12000))return res(ok);   // لا ننتظر مصدرًا متعثرًا أكثر من 12 ثانية بعد جاهزية غيره
      setTimeout(tick,600);
    })();
  });
}

/* ---------- جمع البيانات ---------- */
var months=[],sel="",selFrom="",X=null,sCache={},rCache={};
function collectMonths(){
  var set={},b;
  if(b=bridge("V")){try{(b.data().months||[]).forEach(function(m){var k=normYM(m.m);if(k)set[k]=1})}catch(e){}}
  if(b=bridge("S")){try{(b.state().data.filterOptions.availableMonths||[]).forEach(function(m){var k=normYM(m);if(k)set[k]=1});
    ((b.state().data.analytics||{}).monthly||[]).forEach(function(m){var k=normYM(m.month);if(k)set[k]=1})}catch(e){}}
  return Object.keys(set).sort();
}
function supportMonth(ym){
  if(sCache[ym])return sCache[ym];
  var b=bridge("S");if(!b)return Promise.resolve(null);
  return sCache[ym]=b.call("analytics",{dateFrom:ym+"-01",dateTo:ym+"-"+lastDay(ym)}).catch(function(e){delete sCache[ym];return null});
}
function loadReporting(){
  var b=bridge("R");if(!b)return Promise.resolve(null);
  var norm=function(s){return String(s||"").replace(/[\s_\-]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").toLowerCase()};
  var tabs=b.tabs();
  var pick=function(key,pref){var l=tabs.filter(function(t){return norm(t.name).indexOf(key)>-1});return (pref&&l.filter(function(t){return norm(t.name).indexOf(pref)>-1})[0])||l[0]};
  var jobs={rep:pick("عدمالابلاغ"),img:pick("عدمارسال","تمتبليغ")};
  return Promise.all(["rep","img"].map(function(k){
    var t=jobs[k];if(!t)return null;
    if(rCache[t.gid])return rCache[t.gid];
    return rCache[t.gid]=b.load(t).then(function(x){x.tabName=t.name;return x}).catch(function(){delete rCache[t.gid];return null});
  })).then(function(r){return{rep:r[0],img:r[1]}});
}
function monthsBetween(a,b){var out=[],y=+a.slice(0,4),m=+a.slice(5),ey=+b.slice(0,4),em=+b.slice(5);while(y<ey||(y===ey&&m<=em)){out.push(y+"-"+("0"+m).slice(-2));m++;if(m>12){m=1;y++}}return out}
function supportRange(a,b){
  var key=a+"~"+b;if(sCache[key])return sCache[key];
  var br=bridge("S");if(!br)return Promise.resolve(null);
  return sCache[key]=br.call("analytics",{dateFrom:a+"-01",dateTo:b+"-"+lastDay(b)}).catch(function(e){delete sCache[key];return null});
}
/* ym = شهر النهاية؛ selFrom (اختياري) = شهر البداية: وضع «تجميع عدة شهور» */
function collect(ym){
  var from=selFrom&&selFrom<ym?selFrom:"",set=from?monthsBetween(from,ym):[ym];
  var i=months.indexOf(ym),list=from?set.slice(-12):months.slice(Math.max(0,i-2),i+1);
  var o={ym:ym,from:from,set:set,range:!!from,list:list,prev:(!from&&list.length>1)?list[list.length-2]:null,S:{},SR:null,V:bridge("V")?bridge("V").data():null,R:null,hasS:!!bridge("S")};
  var jobs=list.map(function(m){return supportMonth(m).then(function(a){o.S[m]=a})});
  if(from)jobs.push(supportRange(from,ym).then(function(a){o.SR=a}));
  jobs.push(loadReporting().then(function(r){o.R=r}));
  return Promise.all(jobs).then(function(){if(!from)o.SR=o.S[ym];return o});
}
var periodLabel=function(X){return X.range?(X.from.slice(0,4)===X.ym.slice(0,4)?ymName(X.from)+" – "+ymLabel(X.ym):ymLabel(X.from)+" – "+ymLabel(X.ym)):ymLabel(X.ym)};
var periodName=function(X){return X.range?ymName(X.from)+" – "+ymName(X.ym):ymName(X.ym)};

/* ---------- الفلاتر متعددة الاختيار (الفرع / الموظف) ---------- */
var FIL={br:{},emp:{}},FOPT={br:{},emp:{}};
var nk=function(s){return String(s||"").replace(/^\s*فرع\s+/,"").replace(/[\sـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي")};
var anyK=function(o){for(var k in o)return true;return false};
var passB=function(n){return !anyK(FIL.br)||!!FIL.br[nk(n)]};
var passE=function(n){return !anyK(FIL.emp)||!!FIL.emp[nk(n)]};
var filtering=function(){return anyK(FIL.br)||anyK(FIL.emp)};
function addOpt(kind,name){var n=String(name||"").trim();if(n&&n!=="غير محدد بالمصدر"&&n!=="(فارغ)"&&!FOPT[kind][nk(n)])FOPT[kind][nk(n)]=n}
function collectOptions(){
  FOPT={br:{},emp:{}};
  var v=bridge("V");if(v){try{var D=v.data();D.O.concat(D.U).forEach(function(r){addOpt("br",r.br);addOpt("emp",r.emp)})}catch(e){}}
  if(sel&&X){Object.keys(X.S).forEach(function(m){var a=X.S[m];if(a){(a.branchOutcome||[]).forEach(function(r){addOpt("br",r.name)});(a.employeeOutcome||[]).forEach(function(r){addOpt("emp",r.name)})}})}
  if(X&&X.R){["rep","img"].forEach(function(k){var t=X.R[k];if(t)t.ROWS.forEach(function(r){addOpt("br",rv(t,r,"branch"))})})}
}
function drawFilter(kind,box,label){
  var el=$(box),keys=Object.keys(FOPT[kind]).sort(function(a,b){return FOPT[kind][a].localeCompare(FOPT[kind][b],"ar")});
  var pn=el.querySelector(".pn"),on=Object.keys(FIL[kind]).length;
  el.querySelector("button").textContent=label+": "+(on?on+" محدد":"الكل")+" ▾";
  el.querySelector("button").className=on?"on":"";
  pn.innerHTML='<button type="button" class="clr">مسح التحديد</button>'+keys.map(function(k){return'<label><input type="checkbox" data-k="'+esc(k)+'"'+(FIL[kind][k]?" checked":"")+'>'+esc(FOPT[kind][k])+'</label>'}).join("");
  pn.querySelector(".clr").onclick=function(){FIL[kind]={};drawFilters();if(X)build()};
  pn.querySelectorAll("input").forEach(function(i){i.onchange=function(){var k=i.getAttribute("data-k");if(i.checked)FIL[kind][k]=1;else delete FIL[kind][k];el.querySelector("button").textContent=label+": "+(Object.keys(FIL[kind]).length||"الكل")+(Object.keys(FIL[kind]).length?" محدد":"")+" ▾";el.querySelector("button").className=Object.keys(FIL[kind]).length?"on":"";if(X)build()}});
}
function drawFilters(){drawFilter("br","fBr","الفرع");drawFilter("emp","fEmp","الموظف")}
["fBr","fEmp"].forEach(function(id){var el=$(id);el.querySelector("button").onclick=function(e){e.stopPropagation();var o=el.classList.contains("open");document.querySelectorAll(".ms").forEach(function(x){x.classList.remove("open")});if(!o)el.classList.add("open")};el.querySelector(".pn").onclick=function(e){e.stopPropagation()}});
document.addEventListener("click",function(){document.querySelectorAll(".ms").forEach(function(x){x.classList.remove("open")})});

/* ---------- حسابات Validation ---------- */
var inSet=function(set,m){return Array.isArray(set)?set.indexOf(m)>-1:set===m};
function vOps(D,m,sec){return D.O.filter(function(r){return inSet(m,r.m)&&(!sec||r.sec===sec)&&passB(r.br)&&passE(r.emp)})}
function vUnc(D,m){return D.U.filter(function(r){return inSet(m,r.m)&&passB(r.br)&&passE(r.emp)})}
var vn=function(rows,fn){return rows.reduce(function(s,r){return s+((!fn||fn(r))?r.n:0)},0)};
function vDays(D,key,m){var ms=Array.isArray(m)?m:[m];return ms.reduce(function(t,x){return t+((D.days&&D.days[key==="unc"?"unc":"ops"]||{})[key==="unc"?x:key+"|"+x]||0)},0)}
function vMonth(D,m){
  var d=vn(vOps(D,m,"delivery")),c=vn(vOps(D,m,"cancel")),u=vn(vUnc(D,m));
  var dd=vDays(D,"delivery",m),cd=vDays(D,"cancel",m),ud=vDays(D,"unc",m);
  var days=Math.max(dd,cd,ud);
  return{m:m,del:d,can:c,unc:u,tot:d+c+u,delDays:dd,canDays:cd,uncDays:ud,
    avgTot:days?(d+c+u)/days:null,avgDel:(dd||cd)?(d+c)/Math.max(dd,cd):null,avgUnc:ud?u/ud:null,days:days};
}
function groupBy(rows,kf){var g={};rows.forEach(function(r){var k=kf(r);(g[k]||(g[k]=[])).push(r)});return g}
function resp(rows){var res=vn(rows,function(r){return r.fin==="responded"}),nor=vn(rows,function(r){return r.fin==="noresp"});return{tot:vn(rows),res:res,nor:nor}}
var isReady=function(s){return/جاهز/.test(s||"")},isPost=function(s){return/[تط]أجيل|تاجيل|تأجيل/.test(s||"")},isCancel=function(s){return/[اإأ]لغاء|الغاء/.test(s||"")};
function outcomes(rows){
  var r=rows.filter(function(x){return x.fin==="responded"});
  var a=vn(r,function(x){return isReady(x.sol)}),b=vn(r,function(x){return !isReady(x.sol)&&isPost(x.sol)}),c=vn(r,function(x){return !isReady(x.sol)&&!isPost(x.sol)&&isCancel(x.sol)});
  var t=vn(r);return{ready:a,post:b,cancel:c,other:t-a-b-c,tot:t,fake:vn(r,function(x){return x.fake})};
}

function sMonthRow(a,ym){

  if(m)return m;
  var rows=a.employeeOutcome||[],g=function(k){return sum(rows,function(r){return r[k]||0})};
  return{total:a.team&&a.team.total||g("total"),resolved:g("resolved"),unresolved:g("unresolved"),confirmed:g("confirmed"),notConfirmed:g("notConfirmed")};
}
var okRate=function(r){return rate((r.resolved||0)+(r.confirmed||0),r.total)};   // مؤشر الحل في الشيت = تم الحل + تم التأكيد ÷ الإجمالي

/* ---------- حسابات عدم الإبلاغ ---------- */
function rptRows(t,ym){
  if(!t)return null;
  return t.ROWS.filter(function(r){var k=r.date?normYM(r.date):normYM(r.month);return inSet(ym,k)&&passB(rv(t,r,"branch"))});
}
function rv(t,r,k){return t.C[k]>-1?String(r.v[t.C[k]]==null?"":r.v[t.C[k]]).trim():""}
function topCount(rows,fn,n){
  var m={};rows.forEach(function(r){var k=fn(r)||"(فارغ)";m[k]=(m[k]||0)+1});
  return Object.keys(m).map(function(k){return[k,m[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,n||999);
}

var deck=[],idx=0,sizing=null;
function build(){
  var st=$("stage");status();
  deck=slides(X);
  st.innerHTML=deck.map(function(s){return s.html}).join("");
  var secs=st.querySelectorAll(".sl");
  secs.forEach(function(el,i){var p=el.querySelector(".pg");if(p)p.textContent=i+1});
  $("jump").innerHTML=deck.map(function(s,i){return'<option value="'+i+'">'+(i+1)+". "+esc(s.title.replace(/<[^>]*>/g,"")).slice(0,60)+'</option>'}).join("");

  go(Math.min(idx,deck.length-1));
}
function go(i){
  idx=Math.max(0,Math.min(deck.length-1,i));
  var secs=$("stage").querySelectorAll(".sl");
  secs.forEach(function(el,k){el.classList.toggle("on",k===idx)});
  $("cnt").textContent=deck.length?(idx+1)+" / "+deck.length:"—";
  $("prev").disabled=idx<=0;$("next").disabled=idx>=deck.length-1;$("jump").value=idx;
}
function fit(){
  var vp=$("vp"),w=vp.clientWidth-20,h=vp.clientHeight-20,k=Math.max(.2,Math.min(w/1280,h/720));
  var sc=$("scaler");sc.style.width=1280*k+"px";sc.style.height=720*k+"px";$("stage").style.transform="scale("+k+")";
}
function status(){

  var ok={S:!!bridge("S"),V:!!bridge("V"),R:!!bridge("R")},nm={S:"Control Tower",V:"Validation",R:"عدم الإبلاغ"};
  $("st").innerHTML=(filtering()?'<span class="chip" style="background:var(--gold);color:#1b1f3b" title="الفلاتر تنطبق على Validation وعدم الإبلاغ وجداول/رسوم الفروع والموظفين؛ إجماليات Control Tower وأنواع المشاكل والفترات لا تتأثر">فلاتر نشطة</span> ':"")+Object.keys(ok).map(function(k){return'<span class="chip '+(ok[k]?"ok":"bad")+'">'+nm[k]+(ok[k]?"":" — غير متاح")+'</span>'}).join(" ");
}
var busy=0,retries=0,retryT=null;
function refresh(hard){
  var my=++busy;clearTimeout(retryT);
  if(deck.length<=2){$("msg").style.display="flex";$("msg").textContent="جارٍ قراءة بيانات اللوحات…"}
  if(hard){sCache={};rCache={}}
  return waitReady(hard?15000:90000).then(function(){
    if(my!==busy)return;
    status();
    months=collectMonths();
    var m=$("month");
    if(!sel||months.indexOf(sel)<0)sel=months[months.length-1]||"";
    m.innerHTML=months.map(function(x){return'<option value="'+x+'"'+(x===sel?" selected":"")+'>'+ymLabel(x)+'</option>'}).join("");
    if(selFrom&&(months.indexOf(selFrom)<0||selFrom>=sel))selFrom="";
    $("monthFrom").innerHTML='<option value="">شهر واحد (بدون تجميع)</option>'+months.filter(function(x){return x<sel}).map(function(x){return'<option value="'+x+'"'+(x===selFrom?" selected":"")+'>من: '+ymLabel(x)+'</option>'}).join("");
    if(!sel){$("msg").textContent="لا توجد بيانات متاحة من اللوحات بعد. تأكد من اتصال اللوحات ثم اضغط «تحديث البيانات».";return}
    return collect(sel).then(function(o){
      if(my!==busy)return;X=o;build();status();
      // لو مصدر لم يكن جاهزًا بعد: نعيد المحاولة تلقائيًا (حتى 12 مرة) فتكتمل الشرائح فور وصول بياناته
      if(!(bridge("S")&&bridge("V")&&bridge("R"))&&retries++<12)retryT=setTimeout(function(){refresh(false)},8000);
    });
  });
}

document.addEventListener("keydown",function(e){
  if(/INPUT|SELECT|TEXTAREA/.test((e.target||{}).tagName||""))return;
  var k=e.key;
  if(k==="ArrowLeft"||k==="PageDown"||k===" "){go(idx+1);e.preventDefault()}   // اتجاه RTL: اليسار = التالي
  else if(k==="ArrowRight"||k==="PageUp"){go(idx-1);e.preventDefault()}

});
